<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>Kevin Hub</title><style>:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--sub:#6e6e73;--ac:#007aff;--sep:#d1d1d6}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--sub:#98989f;--ac:#0a84ff;--sep:#38383a}img{filter:invert(.9) hue-rotate(180deg)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:auto;padding:24px 16px 64px}h1{font-size:34px;font-weight:700;margin:8px 0 2px}h2{font-size:22px;margin:0 0 8px}.sub,.note{color:var(--sub);font-size:15px}
.card{display:block;background:var(--card);border-radius:14px;padding:18px;margin:16px 0;text-decoration:none;color:inherit;position:relative}
.rep:active{opacity:.7}.rep p{color:var(--sub);margin:4px 24px 0 0}.date{font-size:13px;color:var(--sub);text-transform:uppercase}.chev{position:absolute;right:18px;top:50%;font-size:28px;color:var(--sep);transform:translateY(-50%)}
img{width:100%;border-radius:8px}a{color:var(--ac)}.back{text-decoration:none;font-size:17px}
table{border-collapse:collapse;font-size:14px;width:100%}td,th{padding:6px;border-bottom:1px solid var(--sep);text-align:left;vertical-align:top}.scroll{overflow-x:auto}
.picks{list-style:none;padding:0}.pick{border-top:1px solid var(--sep);padding:12px 0}.pick p{margin:4px 0;color:var(--sub);font-size:15px}.links{font-size:15px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#34c75933;color:#248a3d}.tag.stretch{background:#ff950033;color:#c76c00}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}#gate input{font-size:22px;padding:12px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--tx);text-align:center;width:200px;letter-spacing:4px}#gate button{font-size:17px;padding:10px 28px;border:0;border-radius:12px;background:var(--ac);color:#fff}#gerr{color:#ff3b30;min-height:20px}
</style></head><body><div id=app hidden><main>
<h1>Kevin Hub</h1><p class=sub>Reports for Tyler, newest first.</p>
<a class="card rep" href="music/"><span class=date>Oct 15, 2026</span><h2>Your Music Map & 25 Discovery Picks</h2><p>Ten years of Spotify listening, your eras, skip patterns, and new artists you've never played.</p><span class=chev>›</span></a>
</main></div><script>// Client-side gate: only a salted PBKDF2-SHA256 hash is stored. Static site, so this is privacy-by-obscurity, not real security.
const GATE={"salt": "1894e344e2a5d624d11e22c451ebe5f2", "iter": 200000, "hash": "2e23dfa20518759a263ab0e1b1d5f6a4a4a758dc70e3e452716967784b1b8b9e"};const KEY='kevinhub_ok';
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const salt=new Uint8Array(GATE.salt.match(/../g).map(h=>parseInt(h,16)));
async function derive(code){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:GATE.iter},k,256))}
function show(){document.getElementById('app').hidden=false;const g=document.getElementById('gate');if(g)g.remove()}
if(localStorage.getItem(KEY)===GATE.hash)show();else{document.body.insertAdjacentHTML('afterbegin','<div id=gate><h2>Kevin Hub</h2><input id=gin type=password inputmode=numeric autocomplete=off placeholder="Passcode"><button id=gbtn>Unlock</button><div id=gerr></div></div>');
const go=async()=>{if(await derive(gin.value)===GATE.hash){localStorage.setItem(KEY,GATE.hash);show()}else{gerr.textContent='Wrong passcode';gin.value=''}};gbtn.onclick=go;gin.onkeydown=e=>{if(e.key==='Enter')go()};gin.focus()}
</script></body></html>
